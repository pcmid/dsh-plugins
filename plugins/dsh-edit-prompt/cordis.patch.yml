# Bundle patch of @pcmid/dsh-edit-prompt: the Host row only carries the
# `archiveSource` setting; the edit button and the resend flow live in the
# Web client half. Override `config` by id from the profile's patch layer, or
# use the switch on the plugin's page.
- insert:
    - id: edit-prompt
      name: '@pcmid/dsh-edit-prompt'
